<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #050508;
      color: #ff69b4;
      font-family: "Courier New", Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    .dialog {
      position: relative;
      z-index: 10;
      width: min(90vw, 420px);
      background: #120814;
      border: 3px solid #ff69b4;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.55), inset 0 0 12px rgba(255, 105, 180, 0.25);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .dialog.hidden {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    .dialog-bar {
      background: #ff69b4;
      color: #120814;
      font-weight: bold;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .dialog-body {
      padding: 28px 22px 26px;
      text-align: center;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.45;
      color: #ffb6d9;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.7);
      margin-bottom: 26px;
      min-height: 58px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 24px;
      min-height: 44px;
    }

    button {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 26px;
      border: 2px solid #ff69b4;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff69b4;
      color: #120814;
      box-shadow: 0 0 12px rgba(255, 105, 180, 0.7);
    }

    #noBtn {
      background: transparent;
      color: #ff69b4;
    }

    .notice {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 8, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .notice.show {
      opacity: 1;
      pointer-events: auto;
    }

    .notice-box {
      background: #120814;
      border: 3px solid #ff69b4;
      padding: 24px 30px;
      min-width: min(85vw, 320px);
      text-align: center;
      box-shadow: 0 0 28px rgba(255, 20, 147, 0.75);
    }

    .notice-text {
      font-size: 22px;
      font-weight: bold;
      color: #ff85c2;
      text-shadow: 0 0 12px #ff1493;
      min-height: 30px;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="dialog" id="dialog">
    <div class="dialog-bar">
      <span>love.exe</span>
      <span>[♥]</span>
    </div>
    <div class="dialog-body">
      <div class="question" id="questionText">Do you want to be my girlfriend?</div>
      <div class="btn-group" id="btnGroup">
        <button type="button" id="yesBtn">Yes</button>
        <button type="button" id="noBtn">No</button>
      </div>
    </div>
  </div>

  <div class="notice" id="notice">
    <div class="notice-box">
      <div class="notice-text" id="noticeText"></div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const QUESTION = "Do you want to be my girlfriend?";
      const CONFIRM_YES_TEXT = "Are you sure???";
      const NO_MESSAGE = "you cant chose NO";
      const THIRD_NO_MESSAGE = "You can't?????";
      const CENTER_TEXT = "LOVE YOU";
      const COLOR = "#ff69b4";

      const dialogEl = document.getElementById("dialog");
      const questionEl = document.getElementById("questionText");
      const btnGroupEl = document.getElementById("btnGroup");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const noticeEl = document.getElementById("notice");
      const noticeTextEl = document.getElementById("noticeText");

      let consecutiveNoCount = 0;
      let onlyYesMode = false;
      let confirmingYes = false;

      let typingTimer = null;
      function startTyping(text) {
        clearTimeout(typingTimer);
        questionEl.textContent = "";
        let index = 0;
        function step() {
          if (index < text.length) {
            questionEl.textContent += text.charAt(index);
            index++;
            typingTimer = setTimeout(step, 45);
          }
        }
        step();
      }

      let noticeTypingTimer = null;
      function typeNotice(text, onComplete) {
        clearTimeout(noticeTypingTimer);
        noticeTextEl.textContent = "";
        let index = 0;
        function step() {
          if (index < text.length) {
            noticeTextEl.textContent += text.charAt(index);
            index++;
            noticeTypingTimer = setTimeout(step, 70);
          } else if (typeof onComplete === "function") {
            onComplete();
          }
        }
        step();
      }

      function returnToMainScreen() {
        showHeart = false;
        confirmingYes = false;
        btnGroupEl.style.display = "flex";
        noBtn.style.display = onlyYesMode ? "none" : "inline-block";
        dialogEl.classList.remove("hidden");
        startTyping(QUESTION);
      }

      startTyping(QUESTION);

      let noTimeout = null;
      noBtn.addEventListener("click", function () {
        if (confirmingYes) return;
        clearTimeout(noTimeout);
        clearTimeout(noticeTypingTimer);

        consecutiveNoCount++;
        dialogEl.classList.add("hidden");
        noticeEl.classList.add("show");

        if (consecutiveNoCount >= 3) {
          onlyYesMode = true;
          consecutiveNoCount = 0;
          typeNotice(THIRD_NO_MESSAGE, function () {
            noTimeout = setTimeout(function () {
              noticeEl.classList.remove("show");
              returnToMainScreen();
            }, 1400);
          });
        } else {
          noticeTextEl.textContent = NO_MESSAGE;
          noTimeout = setTimeout(function () {
            noticeEl.classList.remove("show");
            returnToMainScreen();
          }, 1500);
        }
      });

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      const fontSize = 16;
      const matrixChars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ♥★01LOVE";
      let columns = Math.floor(width / fontSize);
      let drops = Array(columns).fill(1);

      window.addEventListener("resize", function () {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        columns = Math.floor(width / fontSize);
        drops = Array(columns).fill(1);
      });

      function heartPoint(t, cx, cy, scale) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);
        return {
          x: cx + x * scale,
          y: cy - y * scale
        };
      }

      const heartParticles = [];
      const totalParticles = 420;
      for (let i = 0; i < totalParticles; i++) {
        const t = (Math.PI * 2 * i) / totalParticles;
        heartParticles.push({
          t: t,
          offset: Math.random() * 100,
          size: 1.5 + Math.random() * 2
        });
      }

      let showHeart = false;
      let pulseTime = 0;

      yesBtn.addEventListener("click", function () {
        clearTimeout(noTimeout);
        clearTimeout(noticeTypingTimer);
        consecutiveNoCount = 0;
        noticeEl.classList.remove("show");

        if (!confirmingYes) {
          confirmingYes = true;
          noBtn.style.display = "none";
          btnGroupEl.style.display = "flex";
          startTyping(CONFIRM_YES_TEXT);
          return;
        }

        confirmingYes = false;
        dialogEl.classList.add("hidden");
        btnGroupEl.style.display = "none";
        showHeart = true;
      });

      function draw() {
        ctx.fillStyle = "rgba(5, 5, 8, 0.14)";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = showHeart ? "rgba(255, 105, 180, 0.55)" : "rgba(255, 105, 180, 0.25)";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }

        if (showHeart) {
          pulseTime += 0.05;
          const beat = 1 + 0.07 * Math.sin(pulseTime * 2.2);
          const baseScale = Math.min(width, height) / 42;
          const cx = width / 2;
          const cy = height / 2 - 16;

          ctx.save();
          ctx.shadowColor = COLOR;
          ctx.shadowBlur = 14;
          ctx.fillStyle = COLOR;

          for (let i = 0; i < heartParticles.length; i++) {
            const p = heartParticles[i];
            const jitter = Math.sin(pulseTime * 3 + p.offset) * 2.2;
            const pos = heartPoint(p.t, cx, cy, baseScale * beat);

            ctx.beginPath();
            ctx.arc(pos.x + jitter, pos.y + jitter, p.size, 0, Math.PI * 2);
            ctx.fill();
          }

          const textSize = Math.max(24, Math.min(width / 14, 42));
          ctx.font = "bold " + textSize + 'px "Courier New", monospace';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffe0f0";
          ctx.shadowColor = "#ff1493";
          ctx.shadowBlur = 22;
          ctx.fillText(CENTER_TEXT, cx, cy + 6);

          const noteSize = Math.max(14, Math.min(width / 28, 20));
          const blinkAlpha = 0.65 + 0.35 * Math.sin(pulseTime * 3);
          ctx.font = "bold " + noteSize + 'px "Courier New", monospace';
          ctx.fillStyle = `rgba(255, 182, 217, ${blinkAlpha})`;
          ctx.shadowColor = "#ff1493";
          ctx.shadowBlur = 12;
          ctx.fillText(SCREENSHOT_NOTE, cx, cy + baseScale * 17.5);
          ctx.restore();
        }

        requestAnimationFrame(draw);
      }

      draw();
    });
  </script>
</body>
</html>
